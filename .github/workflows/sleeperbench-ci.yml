name: SleeperBench CI

on:
  push:
    branches: [main]
    paths: ['sleeperbench/**']
  pull_request:
    paths: ['sleeperbench/**']

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: sleeperbench
        run: |
          pip install -e ".[dev]"
          pip install ruff mypy
      - name: Lint with ruff
        working-directory: sleeperbench
        run: ruff check .
      - name: Type check with mypy
        working-directory: sleeperbench
        run: mypy --strict .
      - name: Smoke test (no API keys needed)
        working-directory: sleeperbench
        run: python -m sleeperbench.cli run --profile smoke
      - name: Unit tests
        working-directory: sleeperbench
        run: python -m pytest tests/ -v --tb=short
