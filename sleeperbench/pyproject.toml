[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeperbench"
version = "1.0.0"
description = "Benchmark for Persistent Memory Attacks on Stateful LLM Agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["llm", "security", "benchmark", "agents", "persistent-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
ollama = ["openai>=1.0"]
all = ["openai>=1.0", "anthropic>=0.30"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
sleeperbench = "sleeperbench.cli:main"

[project.urls]
Repository = "https://github.com/anonymous/sleeperbench"

[tool.setuptools.packages.find]
include = ["sleeperbench*"]

[tool.setuptools.package-data]
sleeperbench = ["../benchmarks/**/*.yaml", "../benchmarks/**/*.jsonl"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
