---
# RATG Factorial — 9 Models × 2 Defenses (no_defense + ratg) × DTA × N=40
#
# Tests whether RATG (content-layer sanitization) resolves the double dissociation:
# - Does it achieve ASR=0% on ALL 9 models (including qwq:32b)?
# - Does it preserve BTCR=100% (benign facts not stripped)?
#
# Compare to memory_sandbox results (0% for 8/9, 100% for qwq via RAG bypass).
# If RATG blocks qwq too → proof that content-layer > schema-layer.
#
# Run: .venv/bin/python scripts/run_ratg_factorial.py
#
# Estimated: 9 models × 2 conditions × 2 attacks × N=40 = 1440 runs (~3-4 days)
# Or: 9 models × 1 defense (ratg only) × 1 attack (DTA) × N=40 = 360 runs (~1.5 days)

runs_per_condition: 40
results_path: results/ratg_factorial/results.jsonl
db_base_dir: data/runs

models:
  - model_name: qwen2.5:14b
    provider: ollama
    ollama_host: http://localhost:11434
    temperature: 0.0
    context_length: 16384
    rag_session_query_limit: 15
    rate_limit: {max_concurrent: 1, rpm_limit: 60}
  - model_name: qwen3.5:9b
    provider: ollama
    ollama_host: http://localhost:11434
    temperature: 0.0
    context_length: 16384
    rag_session_query_limit: 15
    rate_limit: {max_concurrent: 1, rpm_limit: 60}
