---
# N=10 All-Models DTA Screening — Mac Studio M3 Ultra (96GB)
# Curated set: 20 models × 1 attack × 1 defense × 10 runs = 200 runs
# Est. ~3-5 hours with 4 workers
#
# Ollama serve command (run on Mac Studio BEFORE starting this script):
#   OLLAMA_HOST=0.0.0.0:11434 \
#   OLLAMA_CONTEXT_LENGTH=32768 \
#   OLLAMA_NUM_PARALLEL=4 \
#   OLLAMA_MAX_LOADED_MODELS=4 \
#   OLLAMA_FLASH_ATTENTION=1 \
#   ollama serve
#
# Concurrency strategy (96GB unified memory):
#   Tiny   (≤3GB):  max_concurrent=4  — up to 4 fit simultaneously
#   Small  (4-10GB): max_concurrent=3  — 3 × 10GB = 30GB, safe
#   Medium (13-17GB): max_concurrent=2 — 2 × 17GB = 34GB, safe
#   Large  (20-27GB): max_concurrent=2 — 2 × 27GB = 54GB, safe
#   XLarge (30-35GB): max_concurrent=1 — one at a time
#   Huge   (39-65GB): max_concurrent=1 — one at a time
#   Giant  (65GB+):  max_concurrent=1 — one at a time
#
# Workers=4: small/medium models keep all 4 busy; large models
# serialize naturally via max_concurrent=1.

runs_per_condition: 10
results_path: results/n10_all_models/results.jsonl
db_base_dir: data/runs

# ── Models ────────────────────────────────────────────────────────────────────
# Curated set: keep N=10 archetypes, remove confirmed resistant/drifted models
models:

  # ── Tiny (≤3GB) ─────────────────────────────────────────────────────────────
  - provider: ollama
    model_name: qwen2.5:1.5b
    base_url: http://localhost:11434
    ollama_quantization: q4_0
    rate_limit:
      max_concurrent: 4
      rpm_limit: 999

  # ── Small (4-10GB) ───────────────────────────────────────────────────────────
  - provider: ollama
    model_name: ministral-3:8b
    base_url: http://localhost:11434
    ollama_quantization: q4_0
    rate_limit:
      max_concurrent: 3
      rpm_limit: 999

  - provider: ollama
    model_name: qwen3:8b
    base_url: http://localhost:11434
    ollama_quantization: q4_0
    rate_limit:
      max_concurrent: 3
      rpm_limit: 999

  - provider: ollama
