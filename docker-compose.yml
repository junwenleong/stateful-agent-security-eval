# Numbers verification only. This file does not reproduce the experiments.
#
# The factorial and the follow-up studies ran against Ollama (nine local models) and hosted-model
# endpoints on separate hardware; none of that is started here, and the repository has no
# one-command experiment entry point. `docker compose up` rebuilds the pinned Python environment
# and re-checks the paper's numbers against the raw files in ./results (mounted read-only).
services:
  verify:
    build: .
    command: ["python", "scripts/verify_canonical.py"]
    volumes:
      - ./results:/app/results:ro
